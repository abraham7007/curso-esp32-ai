<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<title>ESP32</title>
	<!--
		El SoC como chip: cuerpo cuadrado y ocho patas gruesas. Mismo motivo
		que el icono i-chip del curso, en versión maciza.

		Todo rasgo mide 4 unidades o más, que a 16 px —el tamaño real de la
		pestaña, y el único que decide si un favicon sirve— son 2 px enteros.
		Esa es la regla que hundió los intentos anteriores: la antena de
		meandro del módulo WROOM y las patas del LED caían por debajo del
		píxel y se empastaban.

		También se descartaron, comparándolas rasterizadas: la silueta maciza
		del módulo, que se lee como una fiambrera, y la de antena en negativo,
		cuyos huecos superiores parecen almenas de castillo.

		El bloque <style> invierte el color en tema oscuro: un favicon vive en
		su propio documento y no ve las variables de la página.
	-->
	<style>
		.chip { fill: #14181f; }
		@media (prefers-color-scheme: dark) { .chip { fill: #eef1f6; } }
	</style>

	<!-- cuerpo del encapsulado -->
	<rect class="chip" x="7" y="7" width="18" height="18" rx="2.5" />

	<!-- patas: dos por cada lado -->
	<rect class="chip" x="1" y="10" width="6" height="4" rx="1" />
	<rect class="chip" x="1" y="18" width="6" height="4" rx="1" />
	<rect class="chip" x="25" y="10" width="6" height="4" rx="1" />
	<rect class="chip" x="25" y="18" width="6" height="4" rx="1" />
	<rect class="chip" x="10" y="1" width="4" height="6" rx="1" />
	<rect class="chip" x="18" y="1" width="4" height="6" rx="1" />
	<rect class="chip" x="10" y="25" width="4" height="6" rx="1" />
	<rect class="chip" x="18" y="25" width="4" height="6" rx="1" />
</svg>
