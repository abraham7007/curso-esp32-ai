<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<title>Módulo ESP32</title>
	<!--
		Módulo ESP32-WROOM: la pantalla y la antena impresa de meandro.

		Negro fijo, sin regla de tema. Una versión anterior invertía el color
		en tema oscuro y aparecía en blanco, que no era lo pedido.

		Ningún rasgo baja de 4 unidades, que a 16 px —el tamaño real de la
		pestaña, y el único que decide si un favicon sirve— son 2 px enteros.
		Esa es la regla que hundió los intentos previos: la antena de trazo
		2,4 y las patas del LED caían por debajo del píxel y se empastaban.

		Se descartaron, comparándolas rasterizadas: la placa DevKit vertical,
		que con sus contactos claros se lee como una calculadora, y la
		variante con almenas laterales, cuyas patas solo ensucian a 16 px.
	-->
	<g fill="#14181f">
		<!-- antena impresa: meandro de dos dientes -->
		<path
			d="M4 13V5h8v8h8V5h8"
			fill="none"
			stroke="#14181f"
			stroke-width="4"
			stroke-linecap="butt"
			stroke-linejoin="miter"
		/>
		<!-- pantalla metálica del módulo -->
		<rect x="3" y="15" width="26" height="14" rx="2.5" />
	</g>
</svg>
