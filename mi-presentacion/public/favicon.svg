<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<title>LED</title>
	<!--
		LED de 5 mm: cúpula, pestaña y dos patas. Es lo primero que el
		estudiante hace parpadear en el curso, y sobre todo es una forma que
		sobrevive a 16 px, que es el tamaño real de la pestaña del navegador y
		el único que decide si un favicon sirve.

		Antes hubo un módulo ESP32-WROOM aquí: más literal, pero su antena y
		sus contactos caían por debajo del píxel y se empastaban. También se
		descartó un LED con destellos radiales —a 16 px los rayos se funden
		con el cuerpo y queda un borrón con púas— y uno sin patas, legible
		pero indistinguible de una bola sobre una base.

		Colores institucionales. El bloque <style> aclara las patas en tema
		oscuro: un favicon vive en su propio documento y no ve las variables
		de la página.
	-->
	<style>
		.bulbo { fill: #c8102e; }
		.patas { fill: #1f3864; }
		.brillo { fill: #ffffff; opacity: .5; }
		@media (prefers-color-scheme: dark) {
			.bulbo { fill: #ff4d67; }
			.patas { fill: #dfe6f4; }
		}
	</style>

	<!-- cúpula del encapsulado -->
	<path class="bulbo" d="M7 20.5V13a9 9 0 0 1 18 0v7.5z" />
	<circle class="brillo" cx="12.6" cy="11.6" r="2.6" />

	<!-- pestaña y patas -->
	<rect class="patas" x="5.5" y="20.5" width="21" height="3.2" rx="1.2" />
	<rect class="patas" x="11" y="23.7" width="3" height="6.3" rx="1.2" />
	<rect class="patas" x="18" y="23.7" width="3" height="6.3" rx="1.2" />
</svg>
