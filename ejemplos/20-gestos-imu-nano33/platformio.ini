; Ejemplo 20 · Gestos con el IMU de la Arduino Nano 33 BLE Sense Rev2 (TensorFlow Lite Micro)
; Dos programas en un proyecto, uno por entorno:
;   pio run -e captura -t upload       -> graba gestos y los imprime en CSV
;   pio run -e inferencia -t upload    -> clasifica gestos con include/model.h
; Rev1 (IMU LSM9DS1): cambia Arduino_BMI270_BMM150 por arduino-libraries/Arduino_LSM9DS1@1.1.1
; aquí y el #include en los dos main.cpp.

[platformio]
default_envs = inferencia

[env]
platform = nordicnrf52@11.0.0
board = nano33ble
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Arduino_BMI270_BMM150@1.2.4

[env:captura]
build_src_filter = +<captura/>

[env:inferencia]
build_src_filter = +<inferencia/>
lib_deps =
    ${env.lib_deps}
    spaziochirale/Chirale_TensorFLowLite@2.0.0
    spaziochirale/ArduTFLite@1.0.2
