; Ejemplo 21 · Colores con el APDS9960 de la Arduino Nano 33 BLE Sense Rev2 (TensorFlow Lite Micro)
; El APDS9960 es el mismo en Rev1 y Rev2: este proyecto vale para las dos.
; Dos programas en un proyecto, uno por entorno:
;   pio run -e captura -t upload       -> imprime el color (r,g,b) de lo que acercas
;   pio run -e inferencia -t upload    -> clasifica el color con include/model.h (int8)

[platformio]
default_envs = inferencia

[env]
platform = nordicnrf52@11.0.0
board = nano33ble
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Arduino_APDS9960@1.0.4

[env:captura]
build_src_filter = +<captura/>

; Sin ArduTFLite: su API solo maneja tensores float y este modelo es int8.
; El sketch usa directamente el intérprete de Chirale_TensorFLowLite.
[env:inferencia]
build_src_filter = +<inferencia/>
lib_deps =
    ${env.lib_deps}
    spaziochirale/Chirale_TensorFLowLite@2.0.0
